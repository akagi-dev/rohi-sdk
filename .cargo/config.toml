[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --partition-table firmwares/altruist-urban/partitions.csv"

[env]
ESP_LOG = "INFO"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C",
  "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]

[alias]
# Run host-side unit tests of hardware independent crates.
test-host = "test -p rohi-sensor-core -p rohi-hal -p rohi-config -p rohi-config-derive -p rohi-config-esp -p rohi-net --target x86_64-unknown-linux-gnu"
