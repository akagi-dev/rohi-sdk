# ROHI hardware and capability support matrix. Schema and status definitions: docs/support/README.md.
# The page docs/support/matrix.md is generated from this file (`cargo run -p rohi-support-matrix -- render --write`).
# Missing evidence is `not-verified`, never success or failure. `hardware_verification = "verified"` requires a
# `hw-report` evidence item.
schema_version = 1
reviewed = "2026-11-02"

# --- Boards ---------------------------------------------------------------------------------------------------

[[hardware]]
id = "altruist-urban-esp32c6"
name = "Altruist Urban"
revision = "ES-ALTRUIST-URB-1, ESP32-C6-WROOM-1-N8"
chip = "esp32c6"
rohi_support = "supported"
firmware = ["rohi-altruist-urban", "altruist-firmware"]
summary = "Outdoor air-quality station: SDS011, BME280 and ICS-43434 microphone. The ROHI C6 pin map is taken from the upstream schematic and is not yet verified on hardware."
upstream = ["up-urban"]

[[hardware]]
id = "altruist-urban-esp32c3"
name = "Altruist Urban (legacy)"
revision = "legacy ESP32-C3 Urban"
chip = "esp32c3"
rohi_support = "supported"
firmware = ["rohi-altruist-urban", "altruist-firmware"]
summary = "Legacy ESP32-C3 variant of the Urban. The ROHI pin map is checked against the Urban pinout, but airalab/hardware documents only the ESP32-C6 board, so there is no upstream schematic for this variant."
upstream = ["up-altruist-fw"]

[[hardware]]
id = "altruist-insight-esp32c6"
name = "Altruist Insight"
revision = "ESP32-C6 (airalab/hardware, Altruist/Insight)"
chip = "esp32c6"
rohi_support = "other-firmware-only"
firmware = ["altruist-firmware"]
summary = "Indoor station with a display and an SCD4x CO2 sensor. ROHI has no Insight board module, firmware or display driver; only the independent altruist-firmware targets it."
upstream = ["up-insight"]

# --- Firmware -------------------------------------------------------------------------------------------------

[[firmware]]
id = "rohi-altruist-urban"
name = "ROHI altruist-urban"
owner = "rohi"
location = "firmwares/altruist-urban"
chips = ["esp32c3", "esp32c6"]
summary = "Rust firmware of this repository, selected per chip by the `esp32c3` / `esp32c6` feature."

[[firmware]]
id = "altruist-firmware"
name = "altruist-firmware"
owner = "external"
location = "https://github.com/airalab/altruist-firmware"
chips = ["esp32c3", "esp32c6"]
summary = "Independent PlatformIO firmware of the Altruist devices with its own feature set; ROHI has not assessed it and its claims are not ROHI support."

# --- Capabilities ---------------------------------------------------------------------------------------------

[[capability]]
id = "bmx280"
kind = "sensor"
name = "BMP280 / BME280 environment"
provides = "temperature (°C), pressure (hPa), relative humidity (%, BME280 only)"
source = "crates/hal/src/sensors/bmx280.rs"

[[capability]]
id = "scd4x"
kind = "sensor"
name = "SCD40 / SCD41 CO2"
provides = "CO2 (ppm), temperature (°C), relative humidity (%)"
source = "crates/hal/src/sensors/scd4x.rs"

[[capability]]
id = "sds011"
kind = "sensor"
name = "SDS011 particulate matter"
provides = "PM2.5 and PM10 (µg/m³)"
source = "crates/hal/src/sensors/sds011/mod.rs"

[[capability]]
id = "noise"
kind = "sensor"
name = "I²S microphone noise level"
provides = "average and maximum sound level (dB SPL, unweighted)"
source = "crates/hal/src/sensors/noise.rs"

[[capability]]
id = "display"
kind = "interface"
name = "Display"
provides = "on-device display output"

[[capability]]
id = "wifi-ip"
kind = "interface"
name = "Wi-Fi station and IP networking"
provides = "Wi-Fi connection, DNS and TCP"
source = "crates/net"

[[capability]]
id = "time-ntp"
kind = "service"
name = "Time synchronisation (NTP)"
provides = "wall-clock time"
source = "crates/time-ntp"

[[capability]]
id = "telemetry"
kind = "service"
name = "Telemetry (connectivity)"
provides = "signed measurement envelopes sent to a connectivity provider"
source = "crates/connectivity"

[[capability]]
id = "ble-control"
kind = "interface"
name = "BLE control plane"
provides = "configuration, status and actions for the `rohi` client over BLE"
source = "crates/control-ble"

[[capability]]
id = "config-store"
kind = "service"
name = "Persistent configuration store"
provides = "typed configuration sections in flash"
source = "crates/config-esp"

[[capability]]
id = "identity"
kind = "service"
name = "Device identity"
provides = "persistent Ed25519 key and signer"
source = "crates/identity"

# --- Use cases ------------------------------------------------------------------------------------------------

[[use_case]]
id = "uc-urban-co2"
title = "Measure CO2 with Altruist Urban"
verdict = "unsupported"
summary = "The Urban board carries no SCD4x. The firmware runs the SCD4x driver and would read a sensor wired to the I²C bus, but no wiring is documented upstream and nothing was verified."
capabilities = ["scd4x"]
missing = ["An upstream-documented way to attach an SCD4x to the Urban", "A hardware report with an SCD4x on the Urban"]

[[use_case]]
id = "uc-noise"
title = "Measure environmental noise with ROHI"
verdict = "partial"
summary = "The Urban microphone yields unweighted dB SPL from the nominal ICS-43434 sensitivity. There is no per-device calibration and no A-weighting, so it is not dBA and not comparable to a calibrated sound level meter."
capabilities = ["noise"]
missing = ["A-weighting (dBA)", "Per-device calibration against a reference meter", "Hardware verification on a board"]

[[use_case]]
id = "uc-insight"
title = "Run ROHI on Altruist Insight"
verdict = "unsupported"
summary = "No ROHI firmware or board module exists for the Insight and no display driver exists. The SCD4x driver exists in the SDK, but nothing integrates it on this board."
capabilities = ["scd4x", "display"]
missing = ["Insight board module in rohi-hal-esp", "Display driver", "Insight firmware", "Hardware verification"]

[[use_case]]
id = "uc-water-quality"
title = "Build a water-quality monitor with existing ROHI firmware"
verdict = "unsupported"
summary = "ROHI has no water-quality sensor driver (pH, turbidity, conductivity, temperature probes), no such board and no firmware. A new device would reuse the SDK services but needs all sensing work."
missing = ["Sensor drivers", "A board definition and firmware", "Calibration procedures", "Hardware verification"]

