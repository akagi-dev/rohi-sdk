[package]
name = "rohi"
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Robonomics Open Hardware desktop client: library and command line tool"

[badges]
maintenance = { status = "actively-developed" }

[lib]
name = "rohi"
path = "src/lib.rs"

[[bin]]
name = "rohi"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "serde"]
# Machine readable (JSON) output of the model types.
serde = ["dep:serde"]
# The `rohi` command line tool.
cli = ["serde", "dep:clap", "dep:rpassword", "dep:serde_json"]

[dependencies]
rohi-control-proto.workspace = true
rohi-control-ble.workspace = true
rohi-net.workspace = true
heapless.workspace = true
btleplug.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }

[dev-dependencies]
rohi-control.workspace = true
rohi-hal.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
