[package]
name = "rohi-examples"
version = "0.0.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[badges]
maintenance = { status = "actively-developed" }

[[bin]]
name = "example-bmx280"
path = "./src/bin/bmx280.rs"

[[bin]]
name = "example-scd4x"
path = "./src/bin/scd4x.rs"

[[bin]]
name = "example-sds011"
path = "./src/bin/sds011.rs"

[[bin]]
name = "example-noise"
path = "./src/bin/noise.rs"

[[bin]]
name = "example-config"
path = "./src/bin/config.rs"

[[bin]]
name = "example-all-sensors"
path = "./src/bin/all-sensors.rs"

[dependencies]
altruist-urban = { path = "../firmwares/altruist-urban" }
rohi-hal = { workspace = true }
rohi-config = { workspace = true }
rohi-hal-esp = { workspace = true }
rohi-config-esp = { workspace = true }
minicbor = { workspace = true }
esp-backtrace = { workspace = true }
esp-hal = { workspace = true }
esp-println = { workspace = true }
esp-rtos = { workspace = true }
esp-alloc = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
embassy-executor = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
static_cell = { workspace = true }
critical-section = { workspace = true }
log = { workspace = true }

[features]
# Exactly one chip feature must be selected, see the firmware package.
default = []
esp32c3 = [
  "altruist-urban/esp32c3",
  "esp-hal/esp32c3",
  "esp-println/esp32c3",
  "esp-backtrace/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
  "esp-rtos/esp32c3",
  "rohi-hal-esp/esp32c3",
  "rohi-config-esp/esp32c3",
]
esp32c6 = [
  "altruist-urban/esp32c6",
  "esp-hal/esp32c6",
  "esp-println/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-rtos/esp32c6",
  "rohi-hal-esp/esp32c6",
  "rohi-config-esp/esp32c6",
]
