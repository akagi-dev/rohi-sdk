[package]
name = "altruist-sim"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native Altruist Urban simulator: the Altruist firmware stack on the host."

[badges]
maintenance = { status = "actively-developed" }

[lib]
name = "altruist_sim"

[[bin]]
name = "altruist-sim"
path = "src/main.rs"

[dependencies]
# The portable application of the firmware, without its ESP platform.
altruist-urban = { path = "../altruist-urban" }
rohi-sdk = { workspace = true, features = [
  "config",
  "service",
  "hal",
  "time",
  "net",
  "ntp",
  "identity",
  "location",
  "control",
  "ble",
  "connectivity",
  "embassy-time",
] }
embassy-executor = { workspace = true, features = [
  "platform-std",
  "executor-thread",
] }
embassy-time = { workspace = true, features = ["std"] }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
static_cell = { workspace = true }
critical-section = { workspace = true }
heapless = { workspace = true }
embedded-io-async = { workspace = true }
embedded-nal-async = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
async-io = { workspace = true }
blocking = { workspace = true }
ctrlc = { workspace = true }

[dev-dependencies]
minicbor = { workspace = true, features = ["std"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util", "net"] }
rohi = { path = "../../tools/rohi", default-features = false }
