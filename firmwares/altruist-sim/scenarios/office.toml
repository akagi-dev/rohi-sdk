# An office: the defaults of the simulator, a CO2 rise at 30 s and a particle
# sensor that fails for 15 s.
#
#   cargo run -p altruist-sim -- --scenario firmwares/altruist-sim/scenarios/office.toml

[device]
name = "urban-sim"

[wifi]
networks = ["ROHI-LAB"]

[sensors]
temperature = 22.5
humidity = 45.0
pressure = 1013.0
co2 = 600
pm25 = 8
pm10 = 12
noise = 42

[[events]]
at = "30s"
action = "set"
sensor = "co2"
value = 1200

[[events]]
at = "60s"
action = "fail"
sensor = "sds011"

[[events]]
at = "75s"
action = "recover"
sensor = "sds011"
