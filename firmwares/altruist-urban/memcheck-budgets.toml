# Budgets of `memcheck` (see scripts/memcheck.sh and docs/validation/resource-budget.md).
#
# Limits are absolute and per chip. They start at the sizes measured on `master` at ca17cb6 (before #63), rounded up
# slightly, so that they stop growth without being a target. Lower a limit when a change shrinks the number; raising
# one is a deliberate decision that needs a reason in the pull request.
#
# `max_frame` is a single function frame, not a stack depth. At the baseline the `Controller` request path had a frame of
# about 30 KB, larger than the whole ESP32-C3 main stack (22 024 B); #63 split it (every backend call is polled through
# `rohi_service::Isolated`) and the limits below are the sizes measured after that. The largest frames now are the
# `control_task` poll and the async main future.

[regression]
# Allowed growth against the base branch, for identical build inputs.
max_section_growth = 5900
max_task_growth = 2900
max_frame_growth = 512

# The `control_task` poll gained the response slots of the request path it now polls through `Isolated`, while the
# frames it replaced (`Controller::execute`, 30 KB) shrank by far more.
[[regression.approved_frame_growth]]
symbol = "__control_task_task"
max_growth = 3200
reason = "the Controller request path was split; its 30 KB frame became 1.7 KB or less"

[[regression.approved_frame_growth]]
symbol = "__connectivity_task_task"
max_growth = 2200
reason = "the publisher owns the packet pool and the route outboxes (3 x 920 B) and builds a sealed packet in its poll"

[[regression.approved_frame_growth]]
symbol = "publish_section"
max_growth = 2000
reason = "a committed private section is decoded on the stack: the telemetry profiles and the connectivity routes (about 1 KB each)"

[[regression.approved_frame_growth]]
symbol = "____embassy_main_task_inner_function"
max_growth = 900
reason = "the async main future holds the telemetry and connectivity statics it initializes"

# The crash records and the boot records of the logging pull request.
[[regression.approved_frame_growth]]
symbol = "__logging_task_task"
max_growth = 768
reason = "the log task poll now writes the boot records of the previous crash (Backends::boot_record)"

[[regression.approved_frame_growth]]
symbol = "rust_begin_unwind"
max_growth = 640
reason = "the panic handler now stores the crash in the retained slot (rohi_crash_esp::on_panic)"

[[regression.approved_frame_growth]]
symbol = "registry::observe::<rohi_sensors::managed::SensorsService"
max_growth = 768
reason = "the sensors status observer is laid out differently after the logging changes; 2 160 B stays far below max_frame"

# Re-baselined for the telemetry and connectivity rewrite (#58, #59, #66). Growth since the previous limits:
# the `telemetry` and `connectivity` services and their Actions, the effective profile and route state, the
# packet pool and outboxes of the publisher (3 x 920 B), one export slot (920 B), a larger envelope bound
# (920 B instead of 544 B) and the 64-byte action result values of the control protocol (the `Response` grew by
# 360 B). The main stack of the ESP32-C3 shrank accordingly: it is what remains of the RAM. It is NOT measured on
# hardware; the largest poll frame (the async main future, 13.1 KB) is below it, but the call depth under it is
# unknown, so treat this as the number to improve first.
#
# `max_data` was raised by 200 B (ESP32-C3, 30 300 → 30 500) and 300 B (ESP32-C6, 33 500 → 33 800) when the
# connectivity rewrite was merged with the persistent logging (#68): `.data` measured 30 400 B and 33 740 B.

[chips.esp32c3]
max_data = 30500
max_bss = 210800
max_task_ram = 43400
min_main_stack = 15800
max_frame = 13200

[chips.esp32c3.focus]
control_dispatch = ["rohi_control::controller", "rohi_service::registry"]
logging = ["rohi_logging::service", "rohi_logging::storage", "rohi_logging::segment"]

[chips.esp32c6]
max_data = 33800
max_bss = 214900
max_task_ram = 43400
min_main_stack = 115700
max_frame = 10900

[chips.esp32c6.focus]
control_dispatch = ["rohi_control::controller", "rohi_service::registry"]
logging = ["rohi_logging::service", "rohi_logging::storage", "rohi_logging::segment"]
