[package]
name = "altruist-urban"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Altruist Urban firmware."

[badges]
maintenance = { status = "actively-developed" }

[[bin]]
name = "altruist-urban"
path = "./src/bin/main.rs"

[dependencies]
# ROHI crates, selected by feature; the chip is chosen by `esp32c3` / `esp32c6`
rohi-sdk = { workspace = true, features = [
  "config",
  "service",
  "hal",
  "time",
  "net",
  "ntp",
  "identity",
  "location",
  "control",
  "ble",
  "connectivity",
  "esp",
  "heap-stats",
] }
esp-hal = { workspace = true }
esp-println = { workspace = true }
esp-backtrace = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
esp-rtos = { workspace = true }
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
embassy-embedded-hal = { workspace = true }
static_cell = { workspace = true }
log = { workspace = true }

[features]
# Exactly one chip feature must be selected: use `cargo check-esp32c3`,
# `cargo check-esp32c6`, `cargo build-esp32c3` or `cargo build-esp32c6`.
default = []
esp32c3 = [
  "esp-hal/esp32c3",
  "esp-println/esp32c3",
  "esp-backtrace/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
  "esp-rtos/esp32c3",
  "rohi-sdk/esp32c3",
]
esp32c6 = [
  "esp-hal/esp32c6",
  "esp-println/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-rtos/esp32c6",
  "rohi-sdk/esp32c6",
]
