name: CI

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-license:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v5

      - name: Check license
        uses: viperproject/check-license-header@v2
        with:
          path: ./
          config: ./.github/license-check/config.json
          strict: false

  host:
    name: Host
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: fmt
            args: --all -- --check --color always
          - command: clippy
            args: --all-targets -- -D warnings
          - command: test
            args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rust-src, rustfmt, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  simulator:
    name: Simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rust-src
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check -p altruist-sim
      - name: Test (unit and end-to-end)
        run: cargo test -p altruist-sim
      - name: No ESP dependency
        run: |
          if cargo tree -p altruist-sim -e normal --prefix none | grep -E '^(esp-|rohi-(hal|net|config)-esp)'; then
            echo "altruist-sim must not depend on ESP crates"; exit 1
          fi

  esp32c3:
    name: ESP32-C3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf
          toolchain: 1.99.1
          components: rust-src, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          key: esp32c3
      - name: Check
        run: cargo check-esp32c3
      - name: Check examples
        run: cargo check -p rohi-examples --no-default-features --features esp32c3 --target riscv32imc-unknown-none-elf
      - name: Clippy
        run: cargo clippy -p altruist-urban -p rohi-examples -p rohi-hal-esp -p rohi-net-esp -p rohi-config-esp --no-default-features --features esp32c3 --target riscv32imc-unknown-none-elf -- -D warnings
      - name: Build
        run: cargo build-esp32c3

  esp32c6:
    name: ESP32-C6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imac-unknown-none-elf
          toolchain: 1.99.1
          components: rust-src, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          key: esp32c6
      - name: Check
        run: cargo check-esp32c6
      - name: Check examples
        run: cargo check -p rohi-examples --no-default-features --features esp32c6 --target riscv32imac-unknown-none-elf
      - name: Clippy
        run: cargo clippy -p altruist-urban -p rohi-examples -p rohi-hal-esp -p rohi-net-esp -p rohi-config-esp --no-default-features --features esp32c6 --target riscv32imac-unknown-none-elf -- -D warnings
      - name: Build
        run: cargo build-esp32c6

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf
          toolchain: 1.99.1
          components: rust-src
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - name: Build the book
        run: mdbook build docs
      - name: Test the book snippets
        run: mdbook test docs
      - name: Check book links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --exclude-path docs/book/404.html docs/book
          fail: true
      - name: Rustdoc (portable crates, warnings and broken links are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Rustdoc (ESP crates, esp32c3)
        run: cargo doc --no-deps -p rohi-hal-esp -p rohi-config-esp -p rohi-net-esp --no-default-features --features esp32c3 --target riscv32imc-unknown-none-elf
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Rustdoc (ESP crates, esp32c6)
        run: cargo doc --no-deps -p rohi-hal-esp -p rohi-config-esp -p rohi-net-esp --no-default-features --features esp32c6 --target riscv32imac-unknown-none-elf
        env:
          RUSTDOCFLAGS: -D warnings
