name: CI

on:
  push:
    branches:
    - 'master'
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  license:
    name: License
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v5
      - name: Check license header
        run: ./scripts/check-license.sh

  checks:
    name: Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: fmt
            args: --all -- --check --color always
          - command: clippy
            args: --all-targets -- -D warnings
          - command: test
            args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rust-src, rustfmt, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  tests:
    name: Tests 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rust-src
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Check the feature combinations (no platform feature builds the portable part)
        run: |
          for features in std std,std-tcp std,std-ble std,std-tcp,std-ble std,sensor-simulator std,std-tcp,std-ble,sensor-simulator; do
            cargo check -p altruist-urban --features "$features"
          done
      - name: Test the portable part
        run: cargo test -p altruist-urban
      - name: Test TCP with simulated sensors (unit and end-to-end)
        run: cargo test -p altruist-urban --features std,std-tcp,sensor-simulator
      - name: Test TCP without simulated sensors
        run: cargo test -p altruist-urban --features std,std-tcp --test std_plain
      - name: Test the BLE peripheral without an adapter
        run: |
          cargo test -p altruist-urban --features std,std-tcp,std-ble --test std_ble
          cargo test -p rohi-net-std --features ble
      - name: Clippy
        run: cargo clippy -p altruist-urban -p rohi-sim -p rohi-net-std --all-targets --features altruist-urban/std,altruist-urban/std-tcp,altruist-urban/std-ble,altruist-urban/sensor-simulator,rohi-net-std/ble,rohi-sim/sensors -- -D warnings

  firmware:
    name: Firmware (${{ matrix.chip }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32c3
            target: riscv32imc-unknown-none-elf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf
          toolchain: 1.99.1
          components: rust-src, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          key: esp32c3
      - name: Check
        run: cargo check-esp32c3
      - name: Check examples
        run: cargo check -p rohi-examples --no-default-features --features ${{ matrix.chip }} --target ${{ matrix.target }} 
      - name: Clippy
        run: cargo clippy -p altruist-urban -p rohi-examples -p rohi-hal-esp -p rohi-net-esp -p rohi-config-esp --no-default-features --features ${{ matrix.chip }} --target ${{ matrix.target }} -- -D warnings
      - name: Build
        run: cargo build-${{ matrix.chip }}

  memory-check:
    name: Memory (${{ matrix.chip }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32c3
            target: riscv32imc-unknown-none-elf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          toolchain: 1.99.1
          components: rust-src
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          key: memcheck-${{ matrix.chip }}
      - name: Build the production and the analysis image
        run: scripts/memcheck.sh images ${{ matrix.chip }} memcheck-out
      - name: Build the base images (same toolchain and flags)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../memcheck-base "$BASE_SHA"
          (cd ../memcheck-base && "$GITHUB_WORKSPACE/scripts/memcheck.sh" images ${{ matrix.chip }} "$GITHUB_WORKSPACE/memcheck-base-out")
          # The base report is produced by this commit's analyzer and budgets, so that both runs are comparable.
          MEMCHECK_GIT_SHA="$BASE_SHA" scripts/memcheck.sh analyze ${{ matrix.chip }} memcheck-base-out || true
      - name: Analyze
        run: |
          base=()
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            test -s memcheck-base-out/task-memory-${{ matrix.chip }}.json
            base=(--base memcheck-base-out/task-memory-${{ matrix.chip }}.json)
          fi
          scripts/memcheck.sh analyze ${{ matrix.chip }} memcheck-out "${base[@]}"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-memory-${{ matrix.chip }}
          path: memcheck-out/task-memory-${{ matrix.chip }}.json
          if-no-files-found: error

  memory-report:
    name: Memory Reports
    needs: memory-check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          key: memcheck-report
      - name: Download the chip reports
        uses: actions/download-artifact@v4
        with:
          pattern: task-memory-*
          path: memcheck-out
          merge-multiple: true
      - name: Render the report
        run: |
          status=0
          scripts/memcheck.sh report memcheck-out || status=$?
          cat memcheck-out/task-memory-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-memory-report
          path: |
            memcheck-out/task-memory-report.md
            memcheck-out/task-memory-summary.md
          if-no-files-found: error
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat memcheck-out/task-memory-summary.md
            echo
            echo "[Complete report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}): the job summary and the \`task-memory-report\` artifact."
          } > memcheck-out/task-memory-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file memcheck-out/task-memory-comment.md --edit-last --create-if-none

  docs-check:
    name: Documentation 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf
          toolchain: 1.99.1
          components: rust-src
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - name: Build the book
        run: mdbook build docs
      - name: Test the book snippets
        run: mdbook test docs
      - name: Check book links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --exclude-path docs/book/404.html docs/book
          fail: true
      - name: Rustdoc (portable crates, warnings and broken links are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Rustdoc (ESP crates, esp32c3)
        run: cargo doc --no-deps -p rohi-hal-esp -p rohi-config-esp -p rohi-net-esp --no-default-features --features esp32c3 --target riscv32imc-unknown-none-elf
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Rustdoc (ESP crates, esp32c6)
        run: cargo doc --no-deps -p rohi-hal-esp -p rohi-config-esp -p rohi-net-esp --no-default-features --features esp32c6 --target riscv32imac-unknown-none-elf
        env:
          RUSTDOCFLAGS: -D warnings
