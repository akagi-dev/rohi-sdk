[package]
name = "rohi-sdk"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ROHI SDK umbrella crate: feature-gated re-exports of the ROHI crates and the cross-cutting contracts"

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
# Host-buildable features only: the chip features are mutually exclusive.
features = [
  "config",
  "service",
  "hal",
  "sensors",
  "telemetry",
  "telemetry-sensors",
  "telemetry-location",
  "telemetry-robonomics",
  "time",
  "net",
  "ntp",
  "identity",
  "location",
  "logging",
  "system",
  "control",
  "ble",
  "connectivity",
  "tcp",
  "host",
  "sim",
]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rohi-config = { workspace = true, optional = true }
rohi-service = { workspace = true, optional = true }
rohi-hal = { workspace = true, optional = true }
rohi-sensors = { workspace = true, optional = true }
rohi-telemetry = { workspace = true, optional = true }
rohi-telemetry-robonomics = { workspace = true, optional = true }
rohi-time = { workspace = true, optional = true }
rohi-time-ntp = { workspace = true, optional = true }
rohi-net = { workspace = true, optional = true }
rohi-identity = { workspace = true, optional = true }
rohi-location = { workspace = true, optional = true }
rohi-logging = { workspace = true, optional = true }
rohi-system = { workspace = true, optional = true }
rohi-control = { workspace = true, optional = true }
rohi-control-ble = { workspace = true, optional = true }
rohi-control-tcp = { workspace = true, optional = true }
rohi-connectivity = { workspace = true, optional = true }
rohi-hal-esp = { workspace = true, optional = true }
rohi-config-esp = { workspace = true, optional = true }
rohi-net-esp = { workspace = true, optional = true }
rohi-net-std = { workspace = true, optional = true }
rohi-sim = { workspace = true, optional = true }

[features]
# Nothing is enabled by default: a product picks the areas it uses.
default = []

# Portable areas, each re-exported as a module of the same name.
config = ["dep:rohi-config"]
service = ["config", "dep:rohi-service"]
# Monotonic time, `time::Clock` and the time service.
time = ["service", "dep:rohi-time"]
# Typed measurements, sensor state, the store and the `sensors` service.
sensors = ["time", "service", "dep:rohi-sensors", "rohi-sensors/service"]
# Physical sensor drivers and their runner (`hal::sensors`).
hal = ["sensors", "dep:rohi-hal"]
net = ["service", "dep:rohi-net"]
ntp = ["time", "net", "dep:rohi-time-ntp"]
identity = ["service", "dep:rohi-identity"]
location = ["service", "dep:rohi-location"]
logging = ["time", "dep:rohi-logging"]
system = ["service", "dep:rohi-system"]
control = ["service", "dep:rohi-control"]
ble = ["control", "net", "dep:rohi-control-ble"]
tcp = ["control", "dep:rohi-control-tcp"]
# `time::EmbassyClock`, the monotonic clock over `embassy-time`.
embassy-time = ["time", "rohi-time/embassy-time"]
# Source-independent telemetry: observations, catalog, packet profiles, the `telemetry` service.
telemetry = ["time", "service", "dep:rohi-telemetry", "rohi-telemetry/service"]
# `telemetry::adapters`: sources over `sensors` and `location`.
telemetry-sensors = ["telemetry", "sensors", "rohi-telemetry/sensors"]
telemetry-location = ["telemetry", "location", "rohi-telemetry/location"]
# The Robonomics Connectivity Protocol packet format.
telemetry-robonomics = ["telemetry", "identity", "dep:rohi-telemetry-robonomics"]
connectivity = ["sensors", "identity", "location", "net", "time", "dep:rohi-connectivity"]

# Host (`std`) backends, module `host`: DNS, TCP and UDP over the sockets of the
# operating system and the TCP listener of the control transport.
host = ["net", "tcp", "dep:rohi-net-std"]
# BlueZ BLE peripheral of the host backends (Linux).
host-ble = ["host", "ble", "rohi-net-std/ble"]
# The simulated world of a `std` application (module `sim`): sensors, Wi-Fi, IP
# faults, flash file, scenarios, management interface.
sim = ["host", "hal", "config", "dep:rohi-sim"]
# Simulated sensor drivers of `sim`.
sim-sensors = ["sim", "rohi-sim/sensors"]

# ESP backends (module `esp`). Exactly one chip feature must be enabled by the
# final firmware build.
esp = ["hal", "config", "net", "dep:rohi-hal-esp", "dep:rohi-config-esp", "dep:rohi-net-esp"]
esp32c3 = ["esp", "rohi-hal-esp/esp32c3", "rohi-config-esp/esp32c3", "rohi-net-esp/esp32c3"]
esp32c6 = ["esp", "rohi-hal-esp/esp32c6", "rohi-config-esp/esp32c6", "rohi-net-esp/esp32c6"]
# Track the minimum free wireless heap (small runtime overhead).
heap-stats = ["esp", "rohi-net-esp/heap-stats"]

# `std` support for host tools and tests.
std = ["rohi-config?/std", "rohi-identity?/std"]

[dev-dependencies]
minicbor = { workspace = true }
