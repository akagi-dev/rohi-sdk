// ROHI local control protocol, version 1.
//
// One request, one response, correlated by `request_id`. The messages are
// bounded: every string, bytes and repeated field has a fixed maximum
// capacity, see `build.rs` and `rohi_control_proto::limits`.
//
// The protocol knows no device module by name. It offers four generic
// planes, all driven by schemas the device publishes:
//
//   config   - desired persistent state, named sections of typed fields
//   status   - observed runtime state of named services, read-only
//   actions  - explicit runtime operations declared by services
//   info     - static description of the device
//
// Compactness: the generated types store every bounded field inline, so the
// size of a message is the size of its largest possible content. Names are
// sent by discovery only; runtime requests address sections, services and
// actions by numeric id, and runtime enum values and issues are numbers whose
// names live in the schema. Collections are never paged: every response
// fits one bounded message.
//
// Unknown enum values must be treated as "unknown" by clients.

syntax = "proto3";

package rohi.control.v1;

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

message Request {
  // Must equal the protocol version of the device (1).
  uint32 protocol_version = 1;
  // Chosen by the client, echoed in the response.
  uint32 request_id = 2;

  oneof request {
    GetInfoRequest get_info = 10;
    ListConfigSectionsRequest list_config_sections = 11;
    GetConfigSchemaRequest get_config_schema = 12;
    GetConfigSectionRequest get_config_section = 13;
    PatchConfigSectionRequest patch_config_section = 14;
    ResetConfigSectionRequest reset_config_section = 15;
    GetServicesStatusRequest get_services_status = 17;
    GetServiceSchemaRequest get_service_schema = 18;
    GetServiceStatusRequest get_service_status = 19;
    ListActionsRequest list_actions = 20;
    GetActionSchemaRequest get_action_schema = 21;
    InvokeActionRequest invoke_action = 22;
    FactoryResetRequest factory_reset = 23;
    RebootRequest reboot = 24;
  }
}

message Response {
  // Protocol version of the device.
  uint32 protocol_version = 1;
  // Echo of `Request.request_id`; 0 when the request could not be parsed.
  uint32 request_id = 2;

  oneof response {
    Error error = 9;
    GetInfoResponse get_info = 10;
    ListConfigSectionsResponse list_config_sections = 11;
    GetConfigSchemaResponse get_config_schema = 12;
    GetConfigSectionResponse get_config_section = 13;
    PatchConfigSectionResponse patch_config_section = 14;
    ResetConfigSectionResponse reset_config_section = 15;
    GetServicesStatusResponse get_services_status = 17;
    GetServiceSchemaResponse get_service_schema = 18;
    GetServiceStatusResponse get_service_status = 19;
    ListActionsResponse list_actions = 20;
    GetActionSchemaResponse get_action_schema = 21;
    InvokeActionResponse invoke_action = 22;
    FactoryResetResponse factory_reset = 23;
    RebootResponse reboot = 24;
  }
}

// ---------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // A field is missing, out of range or inconsistent.
  ERROR_CODE_INVALID_ARGUMENT = 1;
  // The addressed object does not exist.
  ERROR_CODE_NOT_FOUND = 2;
  // The request is unknown or not implemented by this device.
  ERROR_CODE_NOT_SUPPORTED = 3;
  // The device is busy with another operation; retry later.
  ERROR_CODE_BUSY = 4;
  // The backing service is currently unavailable.
  ERROR_CODE_UNAVAILABLE = 5;
  // The link does not satisfy the authorization policy.
  ERROR_CODE_PERMISSION_DENIED = 6;
  // Unexpected device failure.
  ERROR_CODE_INTERNAL = 7;
  // The addressed object changed since the revision the client expected.
  ERROR_CODE_CONFLICT = 8;
  // The action ran and was refused for the stable reason in `Error.reason`.
  ERROR_CODE_REJECTED = 9;
}

message Error {
  ErrorCode code = 1;
  // Stable machine-readable reason, set with `ERROR_CODE_REJECTED`.
  optional string reason = 2;
}

// ---------------------------------------------------------------------------
// Device information
// ---------------------------------------------------------------------------

message GetInfoRequest {}

message GetInfoResponse {
  // Firmware name and version in one string, for example "altruist-urban-0.1.0".
  string firmware = 1;
  // Board and chip in one string, for example "urban-esp32c3".
  string board = 2;
}

// ---------------------------------------------------------------------------
// Generic values and field descriptors
// ---------------------------------------------------------------------------
//
// Configuration and status share one dynamic typing system. A module
// describes its fields once (id, name, kind, unit, ...); clients render and
// parse values from that description and never know a module by name.
//
// The value oneof is repeated, not wrapped, in `FieldValue`, `ConfigEntry`
// and `ConfigMutation`: a nested generic message would cost an extra
// temporary of the full value size.

message Empty {}

enum ValueKind {
  VALUE_KIND_UNSPECIFIED = 0;
  VALUE_KIND_BOOL = 1;
  VALUE_KIND_I64 = 2;
  VALUE_KIND_U64 = 3;
  VALUE_KIND_F32 = 4;
  VALUE_KIND_STRING = 5;
  VALUE_KIND_BYTES = 6;
  // A variant of the enum `FieldDescriptor.enum_id` refers to.
  VALUE_KIND_ENUM = 7;
}

enum Unit {
  UNIT_NONE = 0;
  UNIT_MS = 1;
  UNIT_S = 2;
  UNIT_HZ = 3;
  UNIT_DBM = 4;
  UNIT_BYTES = 5;
  UNIT_PERCENT = 6;
  UNIT_DEGREES = 7;
  UNIT_METERS = 8;
  UNIT_CELSIUS = 9;
  UNIT_PASCAL = 10;
  UNIT_PPM = 11;
  UNIT_PPB = 12;
  UNIT_DECIBELS = 13;
  UNIT_MICROGRAMS_PER_CUBIC_METER = 14;
  UNIT_MICROSIEVERTS_PER_HOUR = 15;
}

message FieldDescriptor {
  // Stable within the section, service or action: only ever added, never
  // reused.
  uint32 id = 1;
  // Stable name; nested fields use dotted paths (`tls.enabled`).
  string name = 2;
  ValueKind kind = 3;
  Unit unit = 4;
  // Id of the `EnumDescriptor` of the same response for `VALUE_KIND_ENUM`
  // fields; 0 for all other fields.
  uint32 enum_id = 5;
}

message EnumVariant {
  uint32 value = 1;
  string name = 2;
}

// The named values of an enum field. A schema response carries a small table
// of them, referenced by `FieldDescriptor.enum_id`, so that fields without an
// enum pay nothing for it.
message EnumDescriptor {
  // Non-zero, unique within the response.
  uint32 id = 1;
  repeated EnumVariant variants = 2;
}

// A value of a status field or an action result. Its strings and bytes are
// shorter than those of requests (`ActionArg`, `ConfigMutation`): responses
// carry many of them and are built on the stack of the device.
message FieldValue {
  uint32 field_id = 1;

  oneof value {
    bool bool_value = 2;
    sint64 i64_value = 3;
    uint64 u64_value = 4;
    float f32_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    // The `value` of an `EnumVariant`.
    uint32 enum_value = 8;
  }
}

// An argument of an action: the same cases as `FieldValue`, with the longer
// strings a request may need (a Wi-Fi passphrase).
message ActionArg {
  uint32 field_id = 1;

  oneof value {
    bool bool_value = 2;
    sint64 i64_value = 3;
    uint64 u64_value = 4;
    float f32_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    uint32 enum_value = 8;
  }
}

// ---------------------------------------------------------------------------
// Configuration
// ---------------------------------------------------------------------------
//
// Desired persistent state. The device exposes a registry of sections; the
// protocol knows none of them. Updates are patches applied atomically per
// section. Secret fields are write-only.

message ConfigSectionInfo {
  // Stable numeric id of the section, the address of every later request.
  // For sections with persistent storage it is the id of the stored section
  // (derived from the name of its type).
  uint64 id = 1;
  // Stable section name, for example "wifi".
  string name = 2;
  // Version of the section schema.
  uint32 version = 3;
  // Changes after every successful write or reset. Restarts from 0 at boot.
  uint32 revision = 4;
}

message ConfigFieldDescriptor {
  FieldDescriptor field = 1;
  // False for fields clients can only read.
  bool writable = 2;
  // Never returned by `GetConfigSection` (reported as `redacted`).
  bool secret = 3;
  // May be unset; unset is distinct from an empty string or zero.
  bool optional = 4;
}

message ListConfigSectionsRequest {}

message ListConfigSectionsResponse {
  repeated ConfigSectionInfo sections = 1;
}

message GetConfigSchemaRequest {
  uint64 section_id = 1;
}

message GetConfigSchemaResponse {
  ConfigSectionInfo section = 1;
  repeated ConfigFieldDescriptor fields = 2;
  repeated EnumDescriptor enums = 3;
}

// Fields that are not set (and not secret) are absent from `entries`.
message ConfigEntry {
  uint32 field_id = 1;

  oneof state {
    bool bool_value = 2;
    sint64 i64_value = 3;
    uint64 u64_value = 4;
    float f32_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    uint32 enum_value = 8;
    // A secret field that is configured.
    Empty redacted = 9;
  }
}

message GetConfigSectionRequest {
  uint64 section_id = 1;
}

message GetConfigSectionResponse {
  uint64 section_id = 1;
  uint32 version = 2;
  uint32 revision = 3;
  repeated ConfigEntry entries = 4;
  // False while nothing is persisted for the section.
  bool configured = 5;
}

message ConfigMutation {
  uint32 field_id = 1;

  oneof operation {
    bool bool_value = 2;
    sint64 i64_value = 3;
    uint64 u64_value = 4;
    float f32_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    uint32 enum_value = 8;
    // Removes the value of an optional field.
    Empty unset = 9;
  }
}

// All mutations are applied to a temporary copy, the complete result is
// validated, and only then persisted. If anything is invalid nothing changes.
message PatchConfigSectionRequest {
  uint64 section_id = 1;
  repeated ConfigMutation mutations = 2;
  // Fails with `ERROR_CODE_CONFLICT` when the section changed meanwhile.
  optional uint32 expected_revision = 3;
  // Validate only; nothing is persisted and the revision does not change.
  bool dry_run = 4;
}

message PatchConfigSectionResponse {
  uint32 revision = 1;
  // The change takes effect after a restart.
  bool restart_required = 2;
}

// Removes the persisted section and restores the module defaults.
message ResetConfigSectionRequest {
  uint64 section_id = 1;
  bool dry_run = 2;
}

message ResetConfigSectionResponse {
  uint32 revision = 1;
  bool restart_required = 2;
}

// Formats the configuration storage: every section is removed, including
// sections this firmware does not know and the device identity, and the
// runtime state derived from configuration returns to the defaults. Damaged
// storage is repaired this way.
message FactoryResetRequest {}

message FactoryResetResponse {
  bool restart_required = 1;
}

// Reboots the device. The device answers first and reboots shortly after, so
// the response is delivered; the link is lost afterwards. Not every device
// can reboot: those answer `ERROR_CODE_NOT_SUPPORTED`.
message RebootRequest {}

message RebootResponse {}

// ---------------------------------------------------------------------------
// Service status
// ---------------------------------------------------------------------------
//
// Observed runtime state, read-only. The device exposes a registry of
// services; the protocol knows none of them. State, health and readiness are
// independent: a running service can be degraded and not ready.

enum ServiceState {
  SERVICE_STATE_UNSPECIFIED = 0;
  // Turned off by configuration; not an error.
  SERVICE_STATE_DISABLED = 1;
  SERVICE_STATE_STOPPED = 2;
  SERVICE_STATE_STARTING = 3;
  SERVICE_STATE_RUNNING = 4;
  SERVICE_STATE_STOPPING = 5;
  SERVICE_STATE_FAILED = 6;
}

enum ServiceHealth {
  SERVICE_HEALTH_UNSPECIFIED = 0;
  SERVICE_HEALTH_UNKNOWN = 1;
  SERVICE_HEALTH_OK = 2;
  SERVICE_HEALTH_DEGRADED = 3;
  SERVICE_HEALTH_ERROR = 4;
}

// Decided by the firmware, which knows which services are mandatory, optional
// or redundant. Clients must not derive it from service health.
enum DeviceHealth {
  DEVICE_HEALTH_UNSPECIFIED = 0;
  DEVICE_HEALTH_OK = 1;
  DEVICE_HEALTH_DEGRADED = 2;
  DEVICE_HEALTH_ERROR = 3;
}

enum IssueSeverity {
  ISSUE_SEVERITY_UNSPECIFIED = 0;
  ISSUE_SEVERITY_INFO = 1;
  ISSUE_SEVERITY_WARNING = 2;
  ISSUE_SEVERITY_ERROR = 3;
  ISSUE_SEVERITY_CRITICAL = 4;
}

// Discovery and compact status of one service in one message. It never
// contains service-specific fields.
message ServiceStatusSummary {
  // Stable numeric id of the service, the address of every later request.
  uint32 service_id = 1;
  // Stable public name, for example "connectivity".
  string name = 2;
  // Version of the status schema.
  uint32 version = 3;

  ServiceState state = 4;
  ServiceHealth health = 5;
  // Whether the service can currently perform its intended role.
  bool ready = 6;
  // Incremented whenever the state, health, readiness or the active issues
  // change. Service-specific values that vary continuously (counters, ages,
  // signal strength) do not change it.
  uint32 revision = 7;
  // Time spent in the current lifecycle state; saturates at the maximum.
  uint32 state_age_ms = 8;
}

message GetServicesStatusRequest {}

message GetServicesStatusResponse {
  // Monotonic device time.
  uint64 uptime_ms = 1;
  DeviceHealth health = 2;
  repeated ServiceStatusSummary services = 3;
}

// A currently active problem of a service, named in the service schema.
message ServiceIssue {
  // Stable numeric code, described by `IssueDescriptor` in the schema. Codes
  // below 256 are reserved for the SDK.
  uint32 code = 1;
  IssueSeverity severity = 2;
  // How long the issue has been active; saturates at the maximum.
  uint32 age_ms = 3;
}

message IssueDescriptor {
  uint32 code = 1;
  // Stable machine-readable name, for example "connection_timeout".
  string name = 2;
}

message GetServiceSchemaRequest {
  uint32 service_id = 1;
}

message GetServiceSchemaResponse {
  uint32 service_id = 1;
  string name = 2;
  uint32 version = 3;
  repeated FieldDescriptor fields = 4;
  repeated EnumDescriptor enums = 5;
  repeated IssueDescriptor issues = 6;
}

message GetServiceStatusRequest {
  uint32 service_id = 1;
}

// Fields without a current value are absent from `fields`. Only currently
// active issues are listed; history belongs to diagnostics. The compact state
// comes from `GetServicesStatus`; `revision` tells whether it is still
// current.
message GetServiceStatusResponse {
  uint32 service_id = 1;
  uint32 revision = 2;
  repeated FieldValue fields = 3;
  repeated ServiceIssue issues = 4;
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
//
// Explicit runtime operations declared by services (scan, reconnect,
// provision, ...). Status stays read-only; everything that changes the
// runtime is an action. An action takes typed arguments and returns zero or
// more records of typed fields.

message ActionInfo {
  uint32 service_id = 1;
  // Stable numeric id, unique within the service.
  uint32 id = 2;
  string name = 3;
  // Needs a link that satisfies the write privilege of the policy.
  bool privileged = 4;
  // The arguments are secrets: clients must not echo or log them and should
  // read them without showing them.
  bool secret_args = 5;
}

message ListActionsRequest {}

message ListActionsResponse {
  repeated ActionInfo actions = 1;
}

message GetActionSchemaRequest {
  uint32 service_id = 1;
  uint32 action_id = 2;
}

message GetActionSchemaResponse {
  ActionInfo action = 1;
  // All arguments are required.
  repeated FieldDescriptor args = 2;
  // Fields of every returned record.
  repeated FieldDescriptor results = 3;
  repeated EnumDescriptor enums = 4;
}

message InvokeActionRequest {
  uint32 service_id = 1;
  uint32 action_id = 2;
  repeated ActionArg args = 3;
}

message ActionRecord {
  repeated FieldValue fields = 1;
}

message InvokeActionResponse {
  repeated ActionRecord records = 1;
}
