// ROHI local control protocol, version 1.
//
// One request, one response, correlated by `request_id`. The messages are
// bounded: every string, bytes and repeated field has a fixed maximum
// capacity, see `control.options` / `build.rs` and `rohi_control_proto::limits`.
//
// Field numbers and enum values are stable; new fields and values may only be
// added, never reused. Unknown enum values must be treated as "unknown" by
// clients.

syntax = "proto3";

package rohi.control.v1;

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

message Request {
  // Must equal the protocol version of the device (1).
  uint32 protocol_version = 1;
  // Chosen by the client, echoed in the response.
  uint32 request_id = 2;

  oneof request {
    GetInfoRequest get_info = 10;
    GetCapabilitiesRequest get_capabilities = 11;
    GetSensorsRequest get_sensors = 12;
    GetConfigRequest get_config = 13;
    UpdateConfigRequest update_config = 14;
    ScanWifiRequest scan_wifi = 20;
    GetWifiStatusRequest get_wifi_status = 21;
    ReconnectWifiRequest reconnect_wifi = 22;
    DisconnectWifiRequest disconnect_wifi = 23;
    GetIdentityRequest get_identity = 30;
    ProvisionIdentityRequest provision_identity = 31;
    EraseIdentityRequest erase_identity = 32;
    GetTimeStatusRequest get_time_status = 40;
  }
}

message Response {
  // Protocol version of the device.
  uint32 protocol_version = 1;
  // Echo of `Request.request_id`; 0 when the request could not be parsed.
  uint32 request_id = 2;

  oneof response {
    Error error = 9;
    GetInfoResponse get_info = 10;
    GetCapabilitiesResponse get_capabilities = 11;
    GetSensorsResponse get_sensors = 12;
    GetConfigResponse get_config = 13;
    UpdateConfigResponse update_config = 14;
    ScanWifiResponse scan_wifi = 20;
    GetWifiStatusResponse get_wifi_status = 21;
    ReconnectWifiResponse reconnect_wifi = 22;
    DisconnectWifiResponse disconnect_wifi = 23;
    GetIdentityResponse get_identity = 30;
    ProvisionIdentityResponse provision_identity = 31;
    EraseIdentityResponse erase_identity = 32;
    GetTimeStatusResponse get_time_status = 40;
  }
}

// ---------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // A field is missing, out of range or inconsistent.
  ERROR_CODE_INVALID_ARGUMENT = 1;
  // The addressed object does not exist.
  ERROR_CODE_NOT_FOUND = 2;
  // The request is unknown or not implemented by this device.
  ERROR_CODE_NOT_SUPPORTED = 3;
  // The device is busy with another operation; retry later.
  ERROR_CODE_BUSY = 4;
  // The backing service is currently unavailable.
  ERROR_CODE_UNAVAILABLE = 5;
  // The link does not satisfy the authorization policy.
  ERROR_CODE_PERMISSION_DENIED = 6;
  // Unexpected device failure.
  ERROR_CODE_INTERNAL = 7;
  // The operation needs a device identity, but none is provisioned.
  ERROR_CODE_IDENTITY_NOT_PROVISIONED = 8;
  // The device already has an identity; erase it explicitly first.
  ERROR_CODE_IDENTITY_ALREADY_PROVISIONED = 9;
}

message Error {
  ErrorCode code = 1;
}

// ---------------------------------------------------------------------------
// Device information and capabilities
// ---------------------------------------------------------------------------

message GetInfoRequest {}

message GetInfoResponse {
  // Firmware name and version in one string, for example "altruist-urban-0.1.0".
  string firmware = 1;
  // Board and chip in one string, for example "urban-esp32c3".
  string board = 2;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_SENSORS = 1;
  CAPABILITY_CONFIG = 2;
  CAPABILITY_WIFI_SCAN = 3;
  CAPABILITY_WIFI_STATUS = 4;
  CAPABILITY_WIFI_CONTROL = 5;
  CAPABILITY_IDENTITY = 6;
  CAPABILITY_TIME = 7;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  repeated Capability capabilities = 1;
}

// ---------------------------------------------------------------------------
// Sensors
// ---------------------------------------------------------------------------

// Canonical units are fixed per type and never negotiated.
enum MeasurementType {
  MEASUREMENT_TYPE_UNSPECIFIED = 0;
  // Degrees Celsius.
  MEASUREMENT_TYPE_TEMPERATURE = 1;
  // Relative humidity, percent.
  MEASUREMENT_TYPE_HUMIDITY = 2;
  // Pressure, pascal.
  MEASUREMENT_TYPE_PRESSURE = 3;
  // CO2 concentration, parts per million.
  MEASUREMENT_TYPE_CO2 = 4;
  // PM2.5 mass concentration, micrograms per cubic meter.
  MEASUREMENT_TYPE_PM2_5 = 5;
  // PM10 mass concentration, micrograms per cubic meter.
  MEASUREMENT_TYPE_PM10 = 6;
  // Average sound level, decibels.
  MEASUREMENT_TYPE_NOISE_AVERAGE = 7;
  // Maximum sound level, decibels.
  MEASUREMENT_TYPE_NOISE_MAXIMUM = 8;
  // Ozone concentration, parts per billion.
  MEASUREMENT_TYPE_O3 = 9;
  // Nitrogen dioxide concentration, parts per billion.
  MEASUREMENT_TYPE_NO2 = 10;
  // Fast air quality index, dimensionless.
  MEASUREMENT_TYPE_AQI_FAST = 11;
  // EPA air quality index, dimensionless.
  MEASUREMENT_TYPE_AQI_EPA = 12;
  // Carbon monoxide concentration, parts per million.
  MEASUREMENT_TYPE_CO = 13;
  // Ionizing radiation dose rate, microsieverts per hour.
  MEASUREMENT_TYPE_RADIATION = 14;
  // Detected radiation pulses, count.
  MEASUREMENT_TYPE_PULSE_COUNT = 15;
}

enum MeasurementState {
  MEASUREMENT_STATE_UNSPECIFIED = 0;
  MEASUREMENT_STATE_UNAVAILABLE = 1;
  MEASUREMENT_STATE_WARMING_UP = 2;
  MEASUREMENT_STATE_VALID = 3;
  MEASUREMENT_STATE_STALE = 4;
  MEASUREMENT_STATE_ERROR = 5;
}

enum SensorState {
  SENSOR_STATE_UNSPECIFIED = 0;
  SENSOR_STATE_NOT_DETECTED = 1;
  SENSOR_STATE_INITIALIZING = 2;
  SENSOR_STATE_WARMING_UP = 3;
  SENSOR_STATE_READY = 4;
  SENSOR_STATE_DEGRADED = 5;
  SENSOR_STATE_ERROR = 6;
}

enum SensorError {
  SENSOR_ERROR_UNSPECIFIED = 0;
  SENSOR_ERROR_TIMEOUT = 1;
  SENSOR_ERROR_BUS = 2;
  SENSOR_ERROR_CRC = 3;
  SENSOR_ERROR_INVALID_DATA = 4;
  SENSOR_ERROR_NOT_READY = 5;
  SENSOR_ERROR_CALIBRATION = 6;
  SENSOR_ERROR_UNKNOWN = 7;
}

message Measurement {
  MeasurementType type = 1;
  // Last valid value in the canonical unit of `type`; absent when never
  // measured.
  optional double value = 2;
  MeasurementState state = 3;
  // Age of `value` at the time of the request.
  optional uint64 age_ms = 4;
}

message Sensor {
  // Identifies the physical sensor instance, for example "bmx280".
  string name = 1;
  SensorState state = 2;
  repeated Measurement measurements = 3;
  // Last error, cleared by the next successful update.
  optional SensorError error = 4;
}

message GetSensorsRequest {}

message GetSensorsResponse {
  // Only sensors that are present.
  repeated Sensor sensors = 1;
  // Device monotonic time at which the snapshot was generated.
  uint64 uptime_ms = 2;
}

// ---------------------------------------------------------------------------
// Configuration
// ---------------------------------------------------------------------------

// The stored Wi-Fi configuration. The password is never returned.
message WifiConfig {
  // SSID, 1..=32 arbitrary bytes.
  bytes ssid = 1;
  bool password_configured = 2;
}

message GetConfigRequest {}

message GetConfigResponse {
  // Absent when Wi-Fi is not configured.
  optional WifiConfig wifi = 1;
}

message Empty {}

message WifiConfigUpdate {
  // Omitted: keep the stored SSID (an SSID is required when nothing is
  // stored yet).
  optional bytes ssid = 1;

  // Omitted: keep the stored password.
  oneof password_update {
    // 8..=64 bytes; replaces the stored password.
    bytes password = 2;
    // Removes the stored password (open network).
    Empty clear_password = 3;
  }
}

message UpdateConfigRequest {
  // Omitted: the Wi-Fi configuration is not touched.
  oneof wifi_update {
    // Partial update, validated as a whole before anything is stored.
    WifiConfigUpdate update_wifi = 1;
    // Removes the Wi-Fi configuration and disconnects.
    Empty clear_wifi = 2;
  }
}

// Success only means that the configuration is stored and handed to the
// runtime, not that the network was reached; observe `GetWifiStatus`.
message UpdateConfigResponse {}

// ---------------------------------------------------------------------------
// Wi-Fi
// ---------------------------------------------------------------------------

enum WifiSecurity {
  WIFI_SECURITY_UNSPECIFIED = 0;
  WIFI_SECURITY_OPEN = 1;
  WIFI_SECURITY_WEP = 2;
  WIFI_SECURITY_WPA = 3;
  WIFI_SECURITY_WPA2 = 4;
  WIFI_SECURITY_WPA_WPA2 = 5;
  WIFI_SECURITY_WPA3 = 6;
  WIFI_SECURITY_WPA2_WPA3 = 7;
  WIFI_SECURITY_ENTERPRISE = 8;
  WIFI_SECURITY_UNKNOWN = 9;
}

enum WifiState {
  WIFI_STATE_UNSPECIFIED = 0;
  WIFI_STATE_NOT_CONFIGURED = 1;
  WIFI_STATE_IDLE = 2;
  WIFI_STATE_SCANNING = 3;
  WIFI_STATE_CONNECTING = 4;
  WIFI_STATE_CONNECTED = 5;
  WIFI_STATE_DISCONNECTED = 6;
  WIFI_STATE_ERROR = 7;
}

enum WifiFailure {
  WIFI_FAILURE_UNSPECIFIED = 0;
  WIFI_FAILURE_NOT_CONFIGURED = 1;
  WIFI_FAILURE_BUSY = 2;
  WIFI_FAILURE_TIMEOUT = 3;
  WIFI_FAILURE_SCAN_FAILED = 4;
  WIFI_FAILURE_NETWORK_NOT_FOUND = 5;
  WIFI_FAILURE_AUTHENTICATION_FAILED = 6;
  WIFI_FAILURE_ASSOCIATION_FAILED = 7;
  WIFI_FAILURE_DHCP_FAILED = 8;
  WIFI_FAILURE_DISCONNECTED = 9;
  WIFI_FAILURE_INVALID_CONFIG = 10;
  WIFI_FAILURE_DRIVER_ERROR = 11;
}

message WifiNetwork {
  bytes ssid = 1;
  sint32 rssi_dbm = 2;
  uint32 channel = 3;
  WifiSecurity security = 4;
}

message ScanWifiRequest {}

message ScanWifiResponse {
  // Strongest first.
  repeated WifiNetwork networks = 1;
}

message WifiConnection {
  bytes ssid = 1;
  sint32 rssi_dbm = 2;
  // IPv4 addresses in network byte order interpreted as big-endian.
  fixed32 ipv4 = 3;
  optional fixed32 gateway = 4;
  optional fixed32 dns = 5;
}

message GetWifiStatusRequest {}

message GetWifiStatusResponse {
  WifiState state = 1;
  // Set in the error and disconnected states.
  optional WifiFailure failure = 2;
  // Set while connected.
  optional WifiConnection connection = 3;
}

message ReconnectWifiRequest {}
message ReconnectWifiResponse {}
message DisconnectWifiRequest {}
message DisconnectWifiResponse {}

// ---------------------------------------------------------------------------
// Identity
// ---------------------------------------------------------------------------
//
// The device holds at most one Ed25519 identity. It is provisioned from the
// host, which derives the secret; the device never generates one. The secret
// is write-only: no response ever contains it.

enum IdentityState {
  IDENTITY_STATE_UNSPECIFIED = 0;
  IDENTITY_STATE_NOT_PROVISIONED = 1;
  IDENTITY_STATE_PROVISIONED = 2;
}

message IdentityInfo {
  IdentityState state = 1;
  // 32-byte Ed25519 public key; set only when provisioned.
  optional bytes public_key = 2;
}

message GetIdentityRequest {}

message GetIdentityResponse {
  IdentityInfo identity = 1;
}

// Succeeds only when no identity is provisioned, otherwise fails with
// `ERROR_CODE_IDENTITY_ALREADY_PROVISIONED`.
message ProvisionIdentityRequest {
  // The derived 32-byte Ed25519 secret key (RFC 8032 seed).
  bytes ed25519_secret = 1;
}

message ProvisionIdentityResponse {
  // 32-byte Ed25519 public key of the stored identity.
  bytes public_key = 1;
}

// Removes the identity; a no-op when none is provisioned.
message EraseIdentityRequest {}
message EraseIdentityResponse {}

// ---------------------------------------------------------------------------
// Time
// ---------------------------------------------------------------------------
//
// Wall-clock time is optional: the device has none until a time source (for
// example NTP) delivered a plausible sample. It is never invented and uptime
// is never reported as Unix time. The time may step when a later sample
// corrects it; durations must be measured with the device's monotonic clock.
// The time is not authenticated.

enum TimeSyncState {
  TIME_SYNC_STATE_UNSPECIFIED = 0;
  // No valid sample yet: `unix_time_ms` is not set.
  TIME_SYNC_STATE_UNSYNCHRONIZED = 1;
  TIME_SYNC_STATE_SYNCHRONIZED = 2;
  // The last sample is older than the stale threshold; `unix_time_ms` is
  // still calculated from it.
  TIME_SYNC_STATE_STALE = 3;
}

enum TimeSource {
  TIME_SOURCE_UNSPECIFIED = 0;
  TIME_SOURCE_NTP = 1;
  TIME_SOURCE_RTC = 2;
  TIME_SOURCE_EXTERNAL = 3;
}

// Category of the most recent failed synchronization attempt.
enum TimeSyncFailure {
  TIME_SYNC_FAILURE_UNSPECIFIED = 0;
  TIME_SYNC_FAILURE_NETWORK_UNAVAILABLE = 1;
  TIME_SYNC_FAILURE_RESOLVE = 2;
  TIME_SYNC_FAILURE_TIMEOUT = 3;
  TIME_SYNC_FAILURE_INVALID_RESPONSE = 4;
  TIME_SYNC_FAILURE_REJECTED = 5;
  TIME_SYNC_FAILURE_IMPLAUSIBLE = 6;
  TIME_SYNC_FAILURE_SOURCE = 7;
}

message GetTimeStatusRequest {}

message GetTimeStatusResponse {
  TimeSyncState state = 1;
  // Milliseconds since the Unix epoch; unset while unsynchronized.
  optional uint64 unix_time_ms = 2;
  // Source of the current time; unset while unsynchronized.
  optional TimeSource source = 3;
  // Milliseconds since the current time was accepted.
  optional uint64 sync_age_ms = 4;
  // Uncertainty of the current time when it was accepted, in milliseconds.
  optional uint32 uncertainty_ms = 5;
  // Failed attempts since the last accepted sample.
  uint32 consecutive_failures = 6;
  // Most recent failure, cleared by the next accepted sample.
  optional TimeSyncFailure last_failure = 7;
}
