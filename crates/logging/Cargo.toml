[package]
name = "rohi-logging"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Robonomics Open Hardware persistent logging: a non-blocking log sink, bounded records and the logging service"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
rohi-hal.workspace = true
rohi-config.workspace = true
rohi-service.workspace = true
rohi-time.workspace = true
minicbor.workspace = true
heapless.workspace = true
embassy-sync.workspace = true
embedded-storage.workspace = true
log.workspace = true

[dev-dependencies]
minicbor = { workspace = true, features = ["std"] }
rohi-config = { workspace = true, features = ["std"] }
embassy-futures.workspace = true
critical-section = { version = "1", features = ["std"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame", "safe-encode", "safe-decode"] }
