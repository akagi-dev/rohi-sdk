[package]
name = "rohi-identity"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Robonomics Open Hardware device identity: persistent Ed25519 key and signer"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = []
# Host tools.
std = ["ed25519-zebra/std", "zeroize/std"]
# `MockSigner` for tests of signer consumers.
mock = []

[dependencies]
rohi-config.workspace = true
rohi-service.workspace = true
heapless.workspace = true
minicbor.workspace = true
ed25519-zebra.workspace = true
curve25519-dalek.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
embassy-sync.workspace = true
minicbor = { workspace = true, features = ["std"] }
