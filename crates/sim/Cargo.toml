[package]
name = "rohi-sim"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Simulated world for ROHI applications on std: sensors, Wi-Fi, IP faults, file-backed config and log flash, scenarios and a management interface"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
rohi-config.workspace = true
rohi-logging.workspace = true
rohi-net.workspace = true
rohi-hal = { workspace = true, features = ["embassy-time"] }
rohi-net-std.workspace = true
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std"] }
embassy-sync = { workspace = true }
critical-section = { workspace = true }
embassy-futures = { workspace = true }
embedded-io-async = { workspace = true }
embedded-nal-async = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }

[dev-dependencies]
minicbor = { workspace = true, features = ["std"] }
tempfile = "3"

[features]
default = []
# Simulated sensor drivers (BMx280, SCD4x, SDS011, noise) over the world.
sensors = []
