[package]
name = "rohi-net-std"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Robonomics Open Hardware networking on a host OS: DNS, TCP and UDP backend for rohi-net, and a TCP acceptor for rohi-control-tcp"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
rohi-net.workspace = true
rohi-control-tcp.workspace = true
embedded-io-async = { workspace = true, features = ["std"] }
embedded-nal-async.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
log.workspace = true
bluer = { workspace = true, optional = true }
rohi-control-ble = { workspace = true, optional = true }

[dev-dependencies]
rohi-control-ble.workspace = true
embassy-futures.workspace = true
tokio = { workspace = true, features = ["time"] }
rohi-control.workspace = true
rohi-control-proto.workspace = true
critical-section.workspace = true

[features]
default = []
# BlueZ BLE peripheral (Linux only).
ble = ["dep:bluer", "dep:rohi-control-ble"]
