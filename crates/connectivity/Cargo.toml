[package]
name = "rohi-connectivity"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Robonomics Open Hardware connectivity: per-route publication of sealed telemetry packets with ordered fallback delivery over HTTP"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
rohi-telemetry.workspace = true
rohi-config.workspace = true
rohi-service.workspace = true
rohi-net.workspace = true
rohi-time.workspace = true
minicbor.workspace = true
heapless.workspace = true
embassy-sync.workspace = true
embassy-futures.workspace = true
embedded-hal-async.workspace = true
embedded-io-async.workspace = true
embedded-nal-async.workspace = true
log.workspace = true

[features]
# `get_payload`: a freshly built sealed packet as a stream, with its pool (one slot of `BYTES` per open stream) and
# the code that serves and expires it. On by default; the Altruist Urban firmware turns it off with `--no-default-features`
# of the `packet-export` feature of `altruist-urban` when it needs the flash and RAM, see docs/validation.
default = ["packet-export"]
packet-export = []

[dev-dependencies]
rohi-net = { path = "../net", features = ["testing"] }
