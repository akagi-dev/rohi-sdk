[package]
name = "rohi-config-esp"
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ESP32 flash backend for rohi-config"

[package.metadata.docs.rs]
targets = ["riscv32imc-unknown-none-elf"]
features = ["esp"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
rohi-config.workspace = true
embedded-storage.workspace = true

esp-storage = { workspace = true, features = [
  "embedded-storage",
], optional = true }
esp-bootloader-esp-idf = { workspace = true, optional = true }

[dev-dependencies]
minicbor.workspace = true

[features]
default = []
# Concrete ESP32-C3 flash driver and partition-table lookup.
esp = ["dep:esp-storage", "dep:esp-bootloader-esp-idf"]
