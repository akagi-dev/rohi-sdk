// ROHI local control protocol, version 2.
//
// One request, one response, correlated by `request_id`. The messages are
// bounded: every string, bytes and repeated field has a fixed maximum
// capacity, see `build.rs` and `rohi_control_proto::limits`.
//
// The protocol knows no device module by name. It offers six generic
// planes, all driven by schemas the device publishes:
//
//   config   - desired persistent state, named sections of typed fields
//   status   - observed runtime state of named services, read-only
//   actions  - explicit runtime operations declared by services
//   results  - the five result formats of an action (empty, inline, records, feed, stream)
//   info     - static description of the device
//
// Compactness: the generated types store every bounded field inline, so the
// size of a message is the size of its largest possible content. Names are
// sent by discovery only; runtime requests address sections, services and
// actions by numeric id, and runtime enum values and issues are numbers whose
// names live in the schema. Collections of configuration and status are never
// paged: every response fits one bounded message. The result of an action has
// one of five formats (`ResultFormat`): a finite collection (`Records`) is
// read page by page with `ReadResultPage`, a binary result (`Stream`) in
// chunks, and a changing source (`Feed`) by polling with a cursor, see
// "Action results" below.
//
// Unknown enum values must be treated as "unknown" by clients.

syntax = "proto3";

package rohi.control.v2;

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

message Request {
  // Must equal the protocol version of the device (2).
  uint32 protocol_version = 1;
  // Chosen by the client, echoed in the response.
  uint32 request_id = 2;

  oneof request {
    GetInfoRequest get_info = 10;
    ListConfigSectionsRequest list_config_sections = 11;
    GetConfigSchemaRequest get_config_schema = 12;
    GetConfigSectionRequest get_config_section = 13;
    PatchConfigSectionRequest patch_config_section = 14;
    ResetConfigSectionRequest reset_config_section = 15;
    GetServicesStatusRequest get_services_status = 17;
    GetServiceSchemaRequest get_service_schema = 18;
    GetServiceStatusRequest get_service_status = 19;
    ListActionsRequest list_actions = 20;
    GetActionSchemaRequest get_action_schema = 21;
    InvokeActionRequest invoke_action = 22;
    ReadStreamRequest read_stream = 23;
    CloseStreamRequest close_stream = 24;
    ReadResultPageRequest read_result_page = 25;
    CloseResultPageRequest close_result_page = 26;
  }
}

message Response {
  // Protocol version of the device.
  uint32 protocol_version = 1;
  // Echo of `Request.request_id`; 0 when the request could not be parsed.
  uint32 request_id = 2;

  oneof response {
    Error error = 9;
    GetInfoResponse get_info = 10;
    ListConfigSectionsResponse list_config_sections = 11;
    GetConfigSchemaResponse get_config_schema = 12;
    GetConfigSectionResponse get_config_section = 13;
    PatchConfigSectionResponse patch_config_section = 14;
    ResetConfigSectionResponse reset_config_section = 15;
    GetServicesStatusResponse get_services_status = 17;
    GetServiceSchemaResponse get_service_schema = 18;
    GetServiceStatusResponse get_service_status = 19;
    ListActionsResponse list_actions = 20;
    GetActionSchemaResponse get_action_schema = 21;
    // The answer of `InvokeAction` has one case per `ResultFormat`: `action_empty`,
    // `action_inline`, `records_page`, `feed_page` or `action_stream`.
    Empty action_empty = 22;
    ReadStreamResponse read_stream = 23;
    CloseStreamResponse close_stream = 24;
    StreamInfo action_stream = 25;
    InlineResult action_inline = 26;
    // The first page (`InvokeAction`) or a later page (`ReadResultPage`) of a
    // `Records` result.
    RecordsPage records_page = 27;
    FeedPage feed_page = 28;
    CloseResultPageResponse close_result_page = 29;
  }
}

// ---------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // A field is missing, out of range or inconsistent.
  ERROR_CODE_INVALID_ARGUMENT = 1;
  // The addressed object does not exist.
  ERROR_CODE_NOT_FOUND = 2;
  // The request is unknown or not implemented by this device.
  ERROR_CODE_NOT_SUPPORTED = 3;
  // The device is busy with another operation; retry later.
  ERROR_CODE_BUSY = 4;
  // The backing service is currently unavailable.
  ERROR_CODE_UNAVAILABLE = 5;
  // The link does not satisfy the authorization policy.
  ERROR_CODE_PERMISSION_DENIED = 6;
  // Unexpected device failure.
  ERROR_CODE_INTERNAL = 7;
  // The action ran and was refused for the stable reason in `Error.reason`.
  ERROR_CODE_REJECTED = 8;
}

// A `PERMISSION_DENIED` error may carry one of these stable reasons:
//   no_psk              the endpoint is restricted and no pre-shared key is provisioned
//   encryption_required a privileged request needs a link that the transport has encrypted
//   pairing_required    a privileged request on a restricted BLE endpoint needs an encrypted link
message Error {
  ErrorCode code = 1;
  // Stable machine-readable reason, set with `ERROR_CODE_REJECTED`.
  optional string reason = 2;
}

// ---------------------------------------------------------------------------
// Device information
// ---------------------------------------------------------------------------

message GetInfoRequest {}

message GetInfoResponse {
  // Firmware name without a version, for example "altruist-urban".
  string firmware = 1;
  // Board and chip in one string, for example "urban-esp32c3". Kept for
  // compatibility; a later revision of the protocol may drop it, `build`
  // already starts with the same platform.
  string board = 2;
  // Build identifier `<platform>/<version>+<sha8>.<YYYYMMDD>`, for example
  // "urban-esp32c3/0.8.0+5c582f4a.20261122". The device sends the same text as
  // the HTTP `User-Agent` of its telemetry requests.
  string build = 3;
}

// ---------------------------------------------------------------------------
// Generic values and field descriptors
// ---------------------------------------------------------------------------
//
// Configuration and status share one dynamic typing system. A module
// describes its fields once (id, name, kind, unit, ...); clients render and
// parse values from that description and never know a module by name.
//
// The value oneof is repeated, not wrapped, in `FieldValue`, `ConfigEntry`
// and `ConfigMutation`: a nested generic message would cost an extra
// temporary of the full value size.

message Empty {}

enum ValueKind {
  VALUE_KIND_UNSPECIFIED = 0;
  VALUE_KIND_BOOL = 1;
  VALUE_KIND_I64 = 2;
  VALUE_KIND_U64 = 3;
  VALUE_KIND_F32 = 4;
  VALUE_KIND_STRING = 5;
  VALUE_KIND_BYTES = 6;
  // A variant of the enum `FieldDescriptor.enum_id` refers to.
  VALUE_KIND_ENUM = 7;
  // A raw 32-byte public key, carried as `bytes_value`.
  VALUE_KIND_ADDRESS = 8;
}

enum Unit {
  UNIT_NONE = 0;
  UNIT_MS = 1;
  UNIT_S = 2;
  UNIT_HZ = 3;
  UNIT_DBM = 4;
  UNIT_BYTES = 5;
  UNIT_PERCENT = 6;
  UNIT_DEGREES = 7;
  UNIT_METERS = 8;
  UNIT_CELSIUS = 9;
  UNIT_PASCAL = 10;
  UNIT_PPM = 11;
  UNIT_PPB = 12;
  UNIT_DECIBELS = 13;
  UNIT_MICROGRAMS_PER_CUBIC_METER = 14;
  UNIT_MICROSIEVERTS_PER_HOUR = 15;
}

message FieldDescriptor {
  // Stable within the section, service or action: only ever added, never
  // reused.
  uint32 id = 1;
  // Stable name; nested fields use dotted paths (`tls.enabled`).
  string name = 2;
  ValueKind kind = 3;
  Unit unit = 4;
  // Id of the `EnumDescriptor` of the same response for `VALUE_KIND_ENUM`
  // fields, or of the `SelectionDescriptor` of the same response for a
  // `VALUE_KIND_BYTES` field that is a bitset over a catalog; 0 for all
  // other fields.
  uint32 enum_id = 5;
}

// A fixed-size bitset field: bit `i` is `byte[i / 8]` bit `i % 8`, least
// significant first. All zeros selects nothing and all ones selects every
// current entry; the entries and their bit indices are listed by the read-only
// action `catalog_action_id` of the service `catalog_service_id`, whose
// records carry `bit_index` (field 1) and `name` (field 2).
message SelectionDescriptor {
  uint32 id = 1;
  uint32 size_bytes = 2;
  uint32 catalog_service_id = 3;
  uint32 catalog_action_id = 4;
}

message EnumVariant {
  uint32 value = 1;
  string name = 2;
}

// The named values of an enum field. A schema response carries a small table
// of them, referenced by `FieldDescriptor.enum_id`, so that fields without an
// enum pay nothing for it.
message EnumDescriptor {
  // Non-zero, unique within the response.
  uint32 id = 1;
  repeated EnumVariant variants = 2;
}

// A value of a status field or an action result. Its strings and bytes are
// shorter than those of requests (`ActionArg`, `ConfigMutation`): responses
// carry many of them and are built on the stack of the device.
message FieldValue {
  uint32 field_id = 1;

  oneof value {
    bool bool_value = 2;
    sint64 i64_value = 3;
    uint64 u64_value = 4;
    float f32_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    // The `value` of an `EnumVariant`.
    uint32 enum_value = 8;
  }
}

// An argument of an action: the same cases as `FieldValue`, with the longer
// strings a request may need (a Wi-Fi passphrase).
message ActionArg {
  uint32 field_id = 1;

  oneof value {
    bool bool_value = 2;
    sint64 i64_value = 3;
    uint64 u64_value = 4;
    float f32_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    uint32 enum_value = 8;
  }
}

// ---------------------------------------------------------------------------
// Configuration
// ---------------------------------------------------------------------------
//
// Desired persistent state. The device exposes a registry of sections; the
// protocol knows none of them. Updates are patches applied atomically per
// section. Secret fields are write-only.

message ConfigSectionInfo {
  // Stable numeric id of the section, the address of every later request.
  // For sections with persistent storage it is the id of the stored section
  // (derived from the name of its type).
  uint64 id = 1;
  // Stable section name, for example "wifi".
  string name = 2;
  // Version of the section schema.
  uint32 version = 3;
}

message ConfigFieldDescriptor {
  FieldDescriptor field = 1;
  // False for fields clients can only read.
  bool writable = 2;
  // Never returned by `GetConfigSection` (reported as `redacted`).
  bool secret = 3;
  // May have no value: its default is "none". Such a field is absent from
  // the effective entries; that is distinct from an empty string or zero.
  bool optional = 4;
}

message ListConfigSectionsRequest {}

message ListConfigSectionsResponse {
  repeated ConfigSectionInfo sections = 1;
}

message GetConfigSchemaRequest {
  uint64 section_id = 1;
}

message GetConfigSchemaResponse {
  ConfigSectionInfo section = 1;
  repeated ConfigFieldDescriptor fields = 2;
  repeated EnumDescriptor enums = 3;
}

// The effective value of a field. A field that has no value (an optional
// field whose default is "none") is absent from the entries.
message ConfigEntry {
  uint32 field_id = 1;

  oneof state {
    bool bool_value = 2;
    sint64 i64_value = 3;
    uint64 u64_value = 4;
    float f32_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    uint32 enum_value = 8;
    // A secret field that is set.
    Empty redacted = 9;
  }
}

message GetConfigSectionRequest {
  uint64 section_id = 1;
}

// The effective configuration of a section is always defined: the firmware
// defaults with the explicit overrides of the user applied. There is no
// "not configured" state.
message GetConfigSectionResponse {
  uint64 section_id = 1;
  uint32 version = 2;
  // The effective value of every field that has one: what the device runs
  // with. Secrets are `redacted`.
  repeated ConfigEntry effective = 3;
  // The ids of the fields the user overrides explicitly. The override value
  // of such a field is its entry in `effective`, so these two lists carry
  // both the effective configuration and the user's overrides.
  repeated uint32 overridden = 4;
}

message ConfigMutation {
  uint32 field_id = 1;

  oneof operation {
    bool bool_value = 2;
    sint64 i64_value = 3;
    uint64 u64_value = 4;
    float f32_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    uint32 enum_value = 8;
    // Overrides an optional field with an explicit "no value" (an open
    // network, a disabled second server). The firmware default no longer
    // applies. Refused for a field that is not optional.
    Empty none = 9;
    // Removes the override of the field: the firmware default applies again.
    // It does not set an optional field to "none".
    Empty clear = 10;
  }
}

// A value creates or replaces the override of the field, `none` overrides an
// optional field with no value, `clear` removes the override. All mutations
// are applied to a temporary copy of the overrides, the complete effective
// result (the firmware defaults with the overrides applied) is validated, and
// only then persisted. If anything is invalid nothing changes.
message PatchConfigSectionRequest {
  uint64 section_id = 1;
  repeated ConfigMutation mutations = 2;
  // Validate only; nothing is persisted.
  bool dry_run = 3;
}

message PatchConfigSectionResponse {
  // The change takes effect after a restart.
  bool restart_required = 1;
}

// Removes every override of the section: the effective configuration is the
// firmware defaults.
message ResetConfigSectionRequest {
  uint64 section_id = 1;
  bool dry_run = 2;
}

message ResetConfigSectionResponse {
  bool restart_required = 1;
}

// ---------------------------------------------------------------------------
// Service status
// ---------------------------------------------------------------------------
//
// Observed runtime state, read-only. The device exposes a registry of
// services; the protocol knows none of them. Health is the one common
// operational indicator of a service.

enum ServiceHealth {
  SERVICE_HEALTH_UNSPECIFIED = 0;
  SERVICE_HEALTH_UNKNOWN = 1;
  SERVICE_HEALTH_OK = 2;
  SERVICE_HEALTH_DEGRADED = 3;
  SERVICE_HEALTH_ERROR = 4;
}

// Decided by the firmware, which knows which services are mandatory, optional
// or redundant. Clients must not derive it from service health.
enum DeviceHealth {
  DEVICE_HEALTH_UNSPECIFIED = 0;
  DEVICE_HEALTH_OK = 1;
  DEVICE_HEALTH_DEGRADED = 2;
  DEVICE_HEALTH_ERROR = 3;
}

enum IssueSeverity {
  ISSUE_SEVERITY_UNSPECIFIED = 0;
  ISSUE_SEVERITY_INFO = 1;
  ISSUE_SEVERITY_WARNING = 2;
  ISSUE_SEVERITY_ERROR = 3;
  ISSUE_SEVERITY_CRITICAL = 4;
}

// Discovery and compact status of one service in one message. It never
// contains service-specific fields.
message ServiceStatusSummary {
  // Stable numeric id of the service, the address of every later request.
  uint32 service_id = 1;
  // Stable public name, for example "connectivity".
  string name = 2;
  // Version of the status schema.
  uint32 version = 3;

  reserved 4, 6, 8;
  reserved "state", "ready", "state_age_ms";

  ServiceHealth health = 5;
  // Incremented whenever the health or the active issues change.
  // Service-specific values that vary continuously (counters, ages, signal
  // strength) do not change it.
  uint32 revision = 7;
}

message GetServicesStatusRequest {}

message GetServicesStatusResponse {
  // Monotonic device time.
  uint64 uptime_ms = 1;
  DeviceHealth health = 2;
  repeated ServiceStatusSummary services = 3;
}

// A currently active problem of a service, named in the service schema.
message ServiceIssue {
  // Stable numeric code, described by `IssueDescriptor` in the schema. Codes
  // below 256 are reserved for the SDK.
  uint32 code = 1;
  IssueSeverity severity = 2;
  // How long the issue has been active; saturates at the maximum.
  uint32 age_ms = 3;
}

message IssueDescriptor {
  uint32 code = 1;
  // Stable machine-readable name, for example "connection_timeout".
  string name = 2;
}

message GetServiceSchemaRequest {
  uint32 service_id = 1;
}

message GetServiceSchemaResponse {
  uint32 service_id = 1;
  string name = 2;
  uint32 version = 3;
  repeated FieldDescriptor fields = 4;
  repeated EnumDescriptor enums = 5;
  repeated IssueDescriptor issues = 6;
}

message GetServiceStatusRequest {
  uint32 service_id = 1;
}

// Fields without a current value are absent from `fields`. Only currently
// active issues are listed; history belongs to diagnostics. The compact state
// comes from `GetServicesStatus`; `revision` tells whether it is still
// current.
message GetServiceStatusResponse {
  uint32 service_id = 1;
  uint32 revision = 2;
  repeated FieldValue fields = 3;
  repeated ServiceIssue issues = 4;
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
//
// Explicit runtime operations declared by services (scan, reconnect,
// provision, ...). Status stays read-only; everything that changes the
// runtime is an action. An action takes typed arguments and returns one result
// in the format it declares (`ActionInfo.result_format`).

// What a link must be allowed to do to invoke an action. Independent of
// `ActionInfo.secret_args`.
enum ActionAccess {
  ACTION_ACCESS_UNSPECIFIED = 0;
  // Reads state or changes nothing.
  ACTION_ACCESS_READ = 1;
  // Changes the runtime or the stored configuration.
  ACTION_ACCESS_MUTATE = 2;
  // Changes what identifies or provisions the device (identity, the whole
  // configuration storage).
  ACTION_ACCESS_PROVISION = 3;
}

// The format of the result of an action. It names the logical shape and the
// guarantees of the result, not the number of messages that carried it, and
// it is fixed by the action: a result never changes format with its size.
enum ResultFormat {
  RESULT_FORMAT_UNSPECIFIED = 0;
  // The operation succeeded and returns no data, by contract (`action_empty`).
  RESULT_FORMAT_EMPTY = 1;
  // One record of the named, typed fields of the schema `results` (`action_inline`).
  RESULT_FORMAT_INLINE = 2;
  // A finite collection of records, each with the fields of `results`
  // (`records_page`, then `ReadResultPage`). An empty collection is an empty
  // `Records`, not `Empty`.
  RESULT_FORMAT_RECORDS = 3;
  // One bounded page of a changing, cursor-addressed source (`feed_page`).
  RESULT_FORMAT_FEED = 4;
  // A binary snapshot of named files read in chunks (`action_stream`).
  RESULT_FORMAT_STREAM = 5;
}

message ActionInfo {
  uint32 service_id = 1;
  // Stable numeric id, unique within the service.
  uint32 id = 2;
  string name = 3;
  // The arguments are secrets: clients must not echo or log them and should
  // read them without showing them.
  bool secret_args = 5;
  // Name of the owning service. A service may have actions without reporting
  // status, so clients cannot resolve the name from the status listing.
  string service = 6;
  // The format of the result, one of five; never `RESULT_FORMAT_UNSPECIFIED`
  // from a device. See "Action results".
  ResultFormat result_format = 7;
  // What the link must be allowed to do to invoke the action; never
  // `ACTION_ACCESS_UNSPECIFIED` from a device.
  ActionAccess access = 4;
}

message ListActionsRequest {
  // Ordinal of the first action to list, in the stable order of the device:
  // services as registered, actions as declared.
  uint32 offset = 1;
}

// One page of the actions of a device. A page holds at most `MAX_ACTIONS`;
// a client asks again with `offset` advanced by the count it received until
// it has `total` actions.
message ListActionsResponse {
  repeated ActionInfo actions = 1;
  // Number of actions of the device.
  uint32 total = 2;
}

message GetActionSchemaRequest {
  uint32 service_id = 1;
  uint32 action_id = 2;
}

message GetActionSchemaResponse {
  ActionInfo action = 1;
  // All arguments are required.
  repeated FieldDescriptor args = 2;
  // Fields of the record (`Inline`) or of every record (`Records`); none for
  // the other formats.
  repeated FieldDescriptor results = 3;
  repeated EnumDescriptor enums = 4;
  repeated SelectionDescriptor selections = 5;
}

message InvokeActionRequest {
  uint32 service_id = 1;
  uint32 action_id = 2;
  repeated ActionArg args = 3;
}

// ---------------------------------------------------------------------------
// Action results
// ---------------------------------------------------------------------------
//
// `InvokeAction` answers with exactly one result of the format of the action:
//
// - `Empty` (`action_empty`): no data, one reply.
// - `Inline` (`action_inline`): one record of typed fields, one reply.
// - `Records` (`records_page`): the first page of a finite collection. When
//   `page_token` is set there are more records, read with `ReadResultPage`.
// - `Feed` (`feed_page`): one cursor page of a changing source, see "Feeds".
// - `Stream` (`action_stream`): a binary snapshot, see "Streams".
//
// The device executes the operation once, on `InvokeAction`; later pages never
// run it again.

message ActionRecord {
  repeated FieldValue fields = 1;
}

message InlineResult {
  // Each field of the schema at most once.
  repeated FieldValue fields = 1;
}

// A page of a finite collection: whole records, never split, in a stable
// order. A page holds at most `MAX_RECORDS` records and fits the encoded
// response limit. An empty `records` with no token is an empty collection.
message RecordsPage {
  repeated ActionRecord records = 1;
  // Set when more records follow: pass it to `ReadResultPage` (and
  // `CloseResultPage`). Opaque to clients; it names a snapshot and a position
  // and grants no authority. Absent on the last page.
  bytes page_token = 2;
}

// Reads the page that starts at `page_token`. Only the connection that
// invoked the action, with the privilege of the action, may read it; the
// device does not run the action again. Repeating a request returns the same
// page while the snapshot is held (it is closed, times out or the link is
// lost; then `ERROR_CODE_NOT_FOUND`). A token of another connection, a closed
// or expired one, or one that is malformed is `ERROR_CODE_NOT_FOUND` and returns
// no records.
message ReadResultPageRequest {
  uint32 service_id = 1;
  uint32 action_id = 2;
  bytes page_token = 3;
}

// Releases the snapshot of `page_token` early. A client may also stop without
// closing: the snapshot times out and a disconnect releases it. A device holds
// a few snapshots at once; an action that needs one more answers
// `ERROR_CODE_BUSY`.
message CloseResultPageRequest {
  uint32 service_id = 1;
  uint32 action_id = 2;
  bytes page_token = 3;
}

message CloseResultPageResponse {}

// ---------------------------------------------------------------------------
// Streams
// ---------------------------------------------------------------------------
//
// A stream is how a service returns a result that does not fit one bounded
// message: log history, a diagnostic bundle. The action response describes
// the files of the stream; the client reads each file in bounded chunks by
// offset and finally closes the stream. The protocol knows no service in
// particular: it only routes a stream to the service that created it.
//
// - A stream is a snapshot: its files do not change while it is open.
// - Reads are idempotent. Repeating a read with the same offset returns the
//   same bytes, so a lost response is simply requested again.
// - A stream is held until the client closes it, the link is lost or the
//   device times it out; after that its id is unknown (`ERROR_CODE_NOT_FOUND`).
// - A device holds a few streams at once; an action that needs one more
//   answers `ERROR_CODE_BUSY` until one is closed.

message StreamFile {
  // Stable within the stream.
  uint32 id = 1;
  // File name the client may use as it is, for example "rohi1.log.lz4".
  string name = 2;
  uint64 size_bytes = 3;
}

message StreamInfo {
  // The service that owns the stream, the address of every later request.
  uint32 service_id = 1;
  // Unique among the open streams of the service.
  uint32 id = 2;
  repeated StreamFile files = 3;
}

message ReadStreamRequest {
  uint32 service_id = 1;
  uint32 stream_id = 2;
  uint32 file_id = 3;
  uint64 offset = 4;
}

message ReadStreamResponse {
  uint32 stream_id = 1;
  uint32 file_id = 2;
  // Echo of the requested offset.
  uint64 offset = 3;
  // At most `MAX_STREAM_CHUNK` bytes; shorter than requested only at the
  // end of the file.
  bytes data = 4;
  // True when `offset + data.len` is the size of the file.
  bool eof = 5;
}

message CloseStreamRequest {
  uint32 service_id = 1;
  uint32 stream_id = 2;
}

message CloseStreamResponse {}

// ---------------------------------------------------------------------------
// Feeds
// ---------------------------------------------------------------------------
//
// An action of the format `Feed` (for example `logging.tail`) reads a source
// that changes while the client polls it, page by page with a cursor. It is
// one `InvokeAction` and one reply: nothing is opened, the device keeps no
// state for the client and no snapshot, so any number of clients can poll it
// for as long as needed. Its access is checked on every invocation. An empty
// page means "caught up", not "complete". The arguments are the ones of the
// action; the entries the source defines are its own contract. For the log
// tail they are `session` (0 on the first call) and `after` (0 for the oldest
// line held), and an entry is one text line.
//
// - `data` holds at most `MAX_FEED_CHUNK` bytes: whole entries of the source,
//   never split across pages. The source says how it keeps progress when an
//   entry is longer than a page.
// - The next call carries the `session` and the `cursor` of the reply.
// - An empty `data` means there is nothing newer than the cursor.
// - The source may be volatile (the log tail is read from RAM only, never
//   from storage) and may lose old entries: see `gap`.

message FeedPage {
  // Identifies the epoch of the source (a boot of the device). Sequences are
  // valid only inside one epoch: a request with another session starts over
  // (`reset`).
  uint32 session = 1;
  // The sequence of the last entry in `data`; the `after` of the next request.
  // Without entries it is the cursor the request carried (0 after a reset).
  uint64 cursor = 2;
  // The sequence of the oldest entry the source holds; 1 when it holds none.
  uint64 oldest_sequence = 3;
  // The sequence of the newest entry the source holds; 0 when it holds none.
  uint64 newest_sequence = 4;
  // The request carried a session or a cursor that does not belong to this
  // epoch: the page is the start of the source in this epoch and the client
  // must start over.
  bool reset = 5;
  // Entries between the cursor of the request and the first entry of `data`
  // that the source had already overwritten; 0 when there is no gap.
  uint64 gap = 6;
  bytes data = 7;
}
