[workspace.package]
rust-version = "1.95"
edition = "2024"
authors = ["Akagi Engineering <admin@akagi.dev>"]
license = "Apache-2.0"
homepage = "https://rohi.akagi.dev"
repository = "https://github.com/akagi-dev/rohi-sdk"

[workspace]
members = ["crates/*", "firmwares/*", "examples"]
resolver = "2"

[workspace.dependencies]
# Local
rohi-hal = { path = "crates/rohi-hal" }
rohi-sensor-core = { path = "crates/rohi-sensor-core" }

# ESP
esp-hal = { version = "1.2.2", features = ["unstable", "esp32c3"] }
esp-println = { version = "0.18.0", features = ["log-04", "esp32c3"] }
esp-backtrace = { version = "0.20.0", features = [
  "panic-handler",
  "println",
  "esp32c3",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }

# Embedded
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
#embedded-devices = { version = "0.10.2", features = ["bosch-bmp280", "log"] }

# Embassy
embassy-executor = { version = "0.10.0", features = [
  "platform-riscv32",
  "executor-thread",
] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-time-driver = { version = "0.2.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3.2"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"

# Math
libm = { version = "0.2.16", default-features = false }

# Others
log = "0.4.34"
heapless = "0.9.3"
static_cell = "2.1.1"
critical-section = "1.2.0"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
# LLVM can perform better optimizations using a single thread
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
