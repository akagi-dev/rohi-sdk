[workspace.package]
rust-version = "1.99.1"
edition = "2024"
authors = ["Akagi Engineering <admin@akagi.dev>"]
license = "Apache-2.0"
homepage = "https://rohi.akagi.dev"
repository = "https://github.com/akagi-dev/rohi-sdk"

[workspace]
members = ["crates/*", "firmwares/*", "tools/*", "examples"]
# Host commands (`cargo test`, `cargo clippy`) cover the portable crates and
# the desktop tools only.
# Firmware and examples are built per chip, see the `check-*` / `build-*`
# aliases in `.cargo/config.toml`.
default-members = ["crates/*", "tools/*"]
resolver = "2"

[workspace.dependencies]
# Local
rohi-hal = { path = "crates/rohi-hal" }
rohi-time = { path = "crates/rohi-time" }
rohi-time-ntp = { path = "crates/rohi-time-ntp" }
rohi-hal-esp = { path = "crates/rohi-hal-esp" }
rohi-config = { path = "crates/rohi-config" }
rohi-config-derive = { path = "crates/rohi-config-derive" }
rohi-config-esp = { path = "crates/rohi-config-esp" }
rohi-net = { path = "crates/rohi-net" }
rohi-net-esp = { path = "crates/rohi-net-esp" }
rohi-control-proto = { path = "crates/rohi-control-proto" }
rohi-control = { path = "crates/rohi-control" }
rohi-control-ble = { path = "crates/rohi-control-ble" }
rohi-identity = { path = "crates/rohi-identity" }

# ESP. Versions are pinned here; the chip (esp32c3 / esp32c6) is selected by
# the firmware features, never globally.
esp-hal = { version = "1.2.2", features = ["unstable"] }
esp-println = { version = "0.18.0", features = ["log-04"] }
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = "0.6.0"
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-radio",
  "esp-alloc",
] }
esp-alloc = "0.11.0"
esp-radio = { version = "=1.0.0-beta.1", features = [
  "wifi",
  "ble",
  "coex",
  "esp-alloc",
  "unstable",
] }
trouble-host = { version = "0.7.0", default-features = false, features = [
  "peripheral",
  "gatt",
  "derive",
  "default-packet-pool-mtu-255",
] }
bt-hci = "0.9.0"

# Embedded
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-nal-async = "0.9.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

# Embassy
embassy-executor = "0.10.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"
embassy-net = { version = "0.9.1", features = [
  "tcp",
  "udp",
  "dns",
  "dhcpv4",
  "medium-ethernet",
] }

# Storage
embedded-storage = "0.3.1"
esp-storage = "0.10.0"

# Serialization
minicbor = { version = "2.3.1", default-features = false, features = [
  "derive",
] }

# Time
sntpc = { version = "0.11.0", default-features = false }

# Protobuf
micropb = { version = "0.6.0", default-features = false, features = [
  "encode",
  "decode",
  "enable-64bit",
] }
micropb-gen = "0.6.0"

# Cryptography
ed25519-zebra = { version = "4.0.3", default-features = false }
zeroize = { version = "1.8", default-features = false }

# Host-only: master SURI loading and hard derivation for identity provisioning
sp-core = { version = "43", default-features = false, features = ["std"] }

# Proc-macro
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5"

# Desktop tools (std only, never used by firmware)
btleplug = "0.13"
tokio = { version = "1", default-features = false, features = [
  "rt",
  "macros",
  "time",
  "sync",
] }
futures = "0.3"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
thiserror = "2"
uuid = "1"

# Dev
proptest = "1.7"

# Math
libm = { version = "0.2.16", default-features = false }

# Others
log = "0.4.34"
heapless = "0.9.3"
static_cell = "2.1.1"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
# LLVM can perform better optimizations using a single thread
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
