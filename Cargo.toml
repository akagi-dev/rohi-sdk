[workspace.package]
rust-version = "1.95"
edition = "2024"
authors = ["Akagi Engineering <admin@akagi.dev>"]
license = "Apache-2.0"
homepage = "https://rohi.akagi.dev"
repository = "https://github.com/akagi-dev/rohi-sdk"

[workspace]
members = ["crates/*", "firmwares/*", "examples"]
resolver = "2"

[workspace.dependencies]
# Local
rohi-hal = { path = "crates/rohi-hal" }
rohi-sensor-core = { path = "crates/rohi-sensor-core" }
rohi-config = { path = "crates/rohi-config" }
rohi-config-derive = { path = "crates/rohi-config-derive" }
rohi-config-esp = { path = "crates/rohi-config-esp" }
rohi-net = { path = "crates/rohi-net" }

# ESP
esp-hal = { version = "1.2.2", features = ["unstable", "esp32c3"] }
esp-println = { version = "0.18.0", features = ["log-04", "esp32c3"] }
esp-backtrace = { version = "0.20.0", features = [
  "panic-handler",
  "println",
  "esp32c3",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-radio",
  "esp-alloc",
  "esp32c3",
] }
esp-alloc = "0.11.0"
esp-radio = { version = "=1.0.0-beta.1", features = [
  "wifi",
  "esp-alloc",
  "unstable",
  "esp32c3",
] }

# Embedded
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

# Embassy
embassy-executor = "0.10.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }

# Storage
embedded-storage = "0.3.1"
esp-storage = { version = "0.10.0", features = ["esp32c3"] }

# Serialization
postcard = { version = "1.1.3", default-features = false, features = [
  "experimental-derive",
] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

# Proc-macro
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5"

# Dev
proptest = "1.7"

# Math
libm = { version = "0.2.16", default-features = false }

# Others
log = "0.4.34"
heapless = "0.9.3"
static_cell = "2.1.1"
critical-section = "1.2.0"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
# LLVM can perform better optimizations using a single thread
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
